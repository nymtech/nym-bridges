
# [PROJECT_DIR]/Cargo.toml
[workspace]
resolver = "3"
members = [
    "crates/nym-bridges-types",
    "crates/nym-bridges",
    "crates/bridge-cfg",
    "crates/nym-bridge",
    "crates/bridge-tools",
]

[workspace.package]
authors = ["Nym Technologies SA"]
version = "0.3.0-rc.2"
edition = "2024"
repository = "https://github.com/nymtech/nym-bridges"
homepage = "https://nymtech.net"
license = "MIT OR Apache-2.0"
rust-version = "1.95"


[workspace.dependencies]
anyhow = "1.0"
base64 = "0.23.1"
bs58 = "0.5.1"
bytes = "1.12"
clap = { version = "4", features = ["derive", "string"] }
ed25519-dalek = { version = "3.0", features = [
    "pkcs8",
    "alloc",
    "pem",
    "rand_core",
    "digest",
] }
futures = "0.3.34"
getrandom = { version = "0.4", default-features = false }
hex = "0.4.3"
lru-slab = "0.1.3"
lazy_static = "1"
once_cell = "1.21"
pin-project-lite = "0.2"
quinn = { version = "0.11", default-features = false, features = [
    "ring",
    "rustls",
    "runtime-tokio",
] }
quinn-proto = { version = "0.11.19", default-features = false, features = [
    "rustls",
] }
rand = "0.10"
rand_chacha = "0.10"
rcgen = "0.14"
reqwest = { version = "0.13.5", default-features = false }
ring = "0.17.14"
russh = "0.65.0"
rustc-hash = "2"
rustls = { version = "0.23.46", default-features = false, features = [
    "std",
    "ring",
    "logging",
] }
rustls-pki-types = "1.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "3.2"
slab = "0.4.12"
socket2 = ">=0.5, <0.7"
tempfile = "3"
tempdir = "0.3"
thiserror = "2.0"
tinyvec = { version = "1.13", features = ["alloc"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
tokio-util = { version = "0.7", features = ["full"] }
toml = "1.1.8"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
    "time",
    "local-time",
] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
uniffi = { version = "0.32.2", features = ["cli"] }
utoipa = "5.2"
uuid = "1.29"
x509-parser = { version = "0.18", features = ["verify"] }
webpki-roots = "1.0"


# Nym Dependencies
nym-config = "2.0.0"
nym-bin-common = "2.0.0"


[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(coverage,coverage_nightly)',
] }
