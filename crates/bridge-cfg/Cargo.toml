[package]
name = "bridge-cfg"
description = "Configuration tooling for Nym transport bridges."
readme = "README.md"
publish = false

version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]

anyhow.workspace = true
clap = { workspace = true, features = ["derive", "string"] }
ed25519-dalek = { workspace = true, features = [
	"pkcs8",
	"alloc",
	"pem",
	"rand_core",
] }
rand = {workspace = true, features = ["thread_rng", "sys_rng"]}
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
similar.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, default-features = false, features = [
	"env-filter",
	"fmt",
	"ansi",
	"time",
	"local-time",
] }
toml_edit.workspace = true
tempdir.workspace = true
reqwest = { workspace = true, default-features = false, features = [
	"json",
	"blocking",
	"rustls",
] }

nym-bridges = { path = "../nym-bridges" }
nym-config.workspace = true
nym-bin-common.workspace = true
