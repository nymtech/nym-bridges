# nym-bridge requests 4 MiB receive buffers on its AmneziaWG sockets; the kernel caps the request
# at rmem_max (often 208 KiB), which drops long-RTT download bursts. This only raises the cap.
# Applied early (10-) so any later operator or distro setting, including a higher one, wins.
net.core.rmem_max = 4194304
