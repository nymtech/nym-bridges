[package]
name = "nym-bridges-types"
description = "Cross platform type support for Nym VPN pluggable transport library."
readme = "README.md"

version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
uniffi-bindings = ["dep:uniffi"]
typescript-bindings = ["dep:ts-rs", "serde"]
serde = ["dep:serde"]

[dependencies]
# bip39 = { workspace = true }
# si-scale = { workspace = true, features = ["lossy-conversions"] }
# strum.workspace = true
# strum_macros.workspace = true
# time = { workspace = true, features = ["serde", "parsing", "formatting"] }
# tracing = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"], optional = true }
# thiserror.workspace = true
ts-rs = { workspace = true, optional = true }
# zeroize.workspace = true
# ipnetwork = { workspace = true, optional = true }
uniffi = { workspace = true, optional = true }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }

[dev-dependencies]
serde_json = { workspace = true }
