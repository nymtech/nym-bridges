
services:
  wg0:
    build:
      context: ../
      target: wg0
      args:
        AWG_VERSION: ${AWG_VERSION:-v3.1.20260828}
        AWG_LEGACY_VERSION: ${AWG_LEGACY_VERSION:-v0.2.13}
    container_name: wg0
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
    networks:
      wgnet:
        ipv4_address: 192.168.100.2

  wg1:
    build:
      context: ../
      target: wg1
    container_name: wg1
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
    networks:
      wgnet:
        ipv4_address: 192.168.100.3

networks:
  wgnet:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24
